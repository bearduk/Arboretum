<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keele Arboretum — tree map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/map.css" />
</head>
<body>
  <header class="app-header">
    <h1>Keele Arboretum — tree map</h1>
    <p class="sub">Flowering cherries and other campus trees (data from the arboretum spreadsheet).</p>
  </header>
  <aside class="layers-panel" id="layers-panel">
    <div class="panel-section">
      <h2>Search</h2>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Tag, species, or keyword…" autocomplete="off" />
        <div id="search-results" class="search-results"></div>
      </div>
    </div>
    <div class="panel-section">
      <h2>Layers</h2>
      <label class="layer-row">
        <input type="checkbox" id="layer-cherries" checked />
        Cherries (<span id="count-cherries">—</span>)
      </label>
      <label class="layer-row">
        <input type="checkbox" id="layer-other" />
        Other trees (<span id="count-other">—</span>)
      </label>
    </div>
    <div class="panel-section">
      <h2>Display</h2>
      <label class="layer-row">
        <input type="checkbox" id="toggle-labels" />
        Show tag numbers
      </label>
    </div>
    <p class="hint">Deep link: add <code>?tag=4001</code> or <code>?square=L7</code> to the URL.</p>
  </aside>
  <div id="map" role="application" aria-label="Campus tree map"></div>
  <footer class="app-footer">
    <span>Map data © OpenStreetMap contributors. Tree locations: Keele University Arboretum.</span>
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/map.js"></script>
</body>
</html>
